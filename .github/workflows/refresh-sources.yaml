name: Refresh catalog sources
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/refresh_github_sources.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Create GitHub App token for source updates
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.TOPO_DEBUG_ACCESS_APP_ID }}
          private-key: ${{ secrets.TOPO_DEBUG_ACCESS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/refresh-catalog-sources
          title: "chore: refresh catalog source SHAs"
          add-paths: data/github_sources.json
