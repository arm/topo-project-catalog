name: Check catalog

on:
  pull_request:
    paths:
      - "data/github_sources.json"
      - "data/catalog.schema.json"
      - "**/*.go"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

concurrency:
  group: check-catalog-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check generated catalog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/update-catalog

      - name: Check catalog is up to date
        run: |
          if git diff --quiet -- data/catalog.json; then
            echo "Catalog already up to date"
            exit 0
          fi

          echo "::error::data/catalog.json is stale. Run 'go run ./cmd/update-catalog' locally and commit the result."
          git diff -- data/catalog.json
          exit 1
