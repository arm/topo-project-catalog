name: Release catalog

on:
  workflow_dispatch:
    inputs:
      release-version:
        description: Version used for the release (without the v prefix)
        required: true
        type: string
      pre-release:
        description: Create a pre-release
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release-version }}
          PRE_RELEASE: ${{ inputs.pre-release }}
        run: |
          args=(
            "v${RELEASE_VERSION}"
            data/*
            --title "v${RELEASE_VERSION}"
            --generate-notes
          )

          if [ "$PRE_RELEASE" = "true" ]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"
